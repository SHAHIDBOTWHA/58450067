        :root {
            --bg-black: #090b0a;
            --card-dark: #111614;

            --border-dark: #26322c;
            --green: #16a34a;
            --green-bright: #22c55e;

        body {

            align-items: center;
            justify-content: space-between;
        }

        .brand-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #090b0a;
            font-size: 16px;
        }
